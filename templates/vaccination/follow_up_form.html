{% extends 'base.html' %}
{% block title %}Add Follow-Up{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'bite_cases:case_detail' case.pk %}" class="p-2 rounded-lg hover:bg-gray-100">&larr; Back</a>
        <h1 class="text-xl font-bold text-predator-black">Add Follow-Up - {{ case.case_number }}</h1>
    </div>
    <div class="card">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div><label class="form-label">Follow-Up Date</label>{{ form.follow_up_date }}</div>
            <div><label class="form-label">Status</label>{{ form.status }}</div>
            <div><label class="form-label">Notes</label>{{ form.notes }}</div>
            <div class="flex gap-2 pt-4">
                <button type="submit" class="btn-primary">Save</button>
                <a href="{% url 'bite_cases:case_detail' case.pk %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
