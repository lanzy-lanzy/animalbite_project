{% extends 'base.html' %}
{% block title %}Scan Result - ABTC System{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="card text-center">
        <div class="w-16 h-16 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center mx-auto text-amber-700">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h1 class="text-xl font-bold text-ink mt-4">No record found</h1>
        <p class="text-sm font-medium text-muted mt-2">We couldn't match this scanned code to a patient or registration.</p>
        {% if code %}
        <div class="mt-4 rounded-xl bg-sage-50 border border-line p-3 text-left">
            <p class="text-[11px] font-bold tracking-widest uppercase text-muted">Scanned value</p>
            <p class="text-sm font-mono text-ink break-all mt-1">{{ code }}</p>
        </div>
        {% endif %}

        <form method="GET" action="{% url 'patients:patient_list' %}" class="mt-5 flex flex-col sm:flex-row gap-2">
            <input type="text" name="q" value="{{ code }}" placeholder="Search by name, patient #, or contact..." class="form-input flex-1">
            <button type="submit" class="btn-primary btn-sm justify-center">Search Patients</button>
        </form>

        <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
            <button type="button" onclick="window.ABTCScan && window.ABTCScan.open()" class="btn-secondary btn-sm inline-flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
                Scan Again
            </button>
            <a href="{% url 'patients:patient_list' %}" class="btn-secondary btn-sm">Back to Patients</a>
        </div>
    </div>
</div>
{% endblock %}
