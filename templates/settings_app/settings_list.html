{% extends 'base.html' %}
{% block title %}System Settings - ABTC System{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-xl font-bold text-ink mb-6">System Settings</h1>
    <div class="card">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead><tr class="border-b border-line"><th class="table-header">Key</th><th class="table-header">Value</th><th class="table-header">Description</th><th class="table-header text-right">Actions</th></tr></thead>
                <tbody class="divide-y divide-sage-100">
                    {% for s in settings %}
                    <tr class="hover:bg-sage-50">
                        <td class="table-cell font-mono text-sm">{{ s.key }}</td>
                        <td class="table-cell">{{ s.value }}</td>
                        <td class="table-cell text-muted text-sm">{{ s.description|default:'-' }}</td>
                        <td class="table-cell text-right"><a href="{% url 'settings_app:settings_edit' s.pk %}" class="btn-secondary btn-xs">Edit</a></td>
                    </tr>
                    {% empty %}<tr><td colspan="4" class="text-center py-8 text-muted">No settings found.</td></tr>{% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
