<div class="flex flex-wrap gap-2 no-print">
    <button type="button" @click="openPreview('{{ request.path }}?{% for k,v in request.GET.items %}{% if k != 'export' and k != 'preview' %}{{ k }}={{ v }}&{% endif %}{% endfor %}export=pdf&preview=1')"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-950 text-white text-sm font-bold hover:bg-emerald-900 shadow">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Preview PDF
    </button>
    <a href="?{% for k,v in request.GET.items %}{% if k != 'export' and k != 'preview' %}{{ k }}={{ v }}&{% endif %}{% endfor %}export=pdf"
       class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-line text-ink text-sm font-bold hover:bg-sage-50">
        Download PDF
    </a>
    <a href="?{% for k,v in request.GET.items %}{% if k != 'export' and k != 'preview' %}{{ k }}={{ v }}&{% endif %}{% endfor %}export=csv"
       class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-line text-ink text-sm font-bold hover:bg-sage-50">
        Export CSV
    </a>
    <button type="button" @click="printPreview()"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-line text-ink text-sm font-bold hover:bg-sage-50">
        Print
    </button>
</div>
