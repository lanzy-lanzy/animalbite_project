services:
  - type: web
    name: animalbite
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: animalbite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEMAPHORE_ENABLED
        value: "False"

databases:
  - name: animalbite-db
    plan: free
    region: singapore
    databaseName: animalbite
    user: animalbite
    ipAllowList: []
